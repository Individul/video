<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>vid</title>
<link rel="stylesheet" href="/static/style.css?v=23">
</head>
<body>

<!-- Sidebar (desktop) / Nav-bar (mobil) -->
<nav id="nav">
  <div class="nav-logo">vid</div>
  <div class="nav-items">
    <button class="nav-item active" data-view="home" aria-label="Acasă">
      <svg viewBox="0 0 24 24"><path d="M12 3l9 8h-3v9h-5v-6h-3v6H6v-9H3z"/></svg>
      <span class="nav-tip">Acasă</span>
    </button>
    <button class="nav-item" data-view="search" aria-label="Căutare">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.8l-.3-.3a6.5 6.5 0 1 0-.7.7l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg>
      <span class="nav-tip">Căutare</span>
    </button>
    <button class="nav-item" data-view="watchlist" aria-label="Watchlist">
      <svg viewBox="0 0 24 24"><path d="M12 17.3l-6.2 3.7 1.6-7L2 9.2l7.1-.6L12 2l2.9 6.6 7.1.6-5.4 4.8 1.6 7z"/></svg>
      <span class="nav-tip">Watchlist</span>
    </button>
    <button class="nav-item" data-view="continue" aria-label="Continuă">
      <svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 0 0-9 9H1l3.9 3.9L8.8 12h-3a7 7 0 1 1 2 5l1.4 1.4A9 9 0 1 0 13 3zm-1 5v5l4.3 2.5.7-1.2-3.5-2V8z"/></svg>
      <span class="nav-tip">Continuă</span>
    </button>
    <button class="nav-item" data-view="downloads" aria-label="Descărcări">
      <svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5zM19 9h-4V3H9v6H5l7 7z"/></svg>
      <span class="nav-tip">Descărcări</span>
    </button>
  </div>
</nav>

<main id="content"></main>

<!-- Overlay căutare -->
<div id="search-overlay" class="search-overlay hidden">
  <div class="search-box">
    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.8l-.3-.3a6.5 6.5 0 1 0-.7.7l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg>
    <input id="search-input" type="search" placeholder="Caută filme și seriale... (Enter pentru tot)" autocomplete="off">
    <button id="search-close" class="search-close">&times;</button>
  </div>
  <div id="search-results" class="search-results"></div>
</div>

<!-- Modal detaliu -->
<div id="modal" class="modal hidden">
  <div class="modal-panel">
    <span id="modal-close" class="modal-close">&times;</span>
    <div id="modal-body"></div>
  </div>
  <div id="modal-fade" class="scroll-fade hidden"></div>
</div>

<!-- Login (publicat pe web cu parolă) -->
<div id="login-overlay" class="login-overlay hidden">
  <div class="login-panel">
    <div class="nav-logo" style="margin:0 auto 1rem">vid</div>
    <div class="login-title">Autentificare</div>
    <input id="login-pass" type="password" placeholder="Parola" autocomplete="current-password">
    <button class="btn" id="login-btn">Intră</button>
    <div id="login-err" class="login-err hidden"></div>
  </div>
</div>

<script src="/static/app.js?v=21"></script>
</body>
</html>
