<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cinema</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="apple-touch-icon" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/style.css?v=33">
</head>
<body>

<!-- Sidebar (desktop) / Nav-bar (mobil) -->
<nav id="nav">
  <div class="nav-logo">Cinema</div>
  <div class="nav-items">
    <button class="nav-item active" data-view="home" aria-label="Acasă">
      <svg viewBox="0 0 24 24"><path d="M12 3l9 8h-3v9h-5v-6h-3v6H6v-9H3z"/></svg>
      <span class="nav-tip">Acasă</span>
    </button>
    <button class="nav-item" data-view="search" aria-label="Căutare">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.8l-.3-.3a6.5 6.5 0 1 0-.7.7l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg>
      <span class="nav-tip">Căutare</span>
    </button>
    <div class="nav-sep"></div>
    <button class="nav-item nav-cat" data-view="films" aria-label="Filme">
      <svg viewBox="0 0 24 24"><path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V4z"/></svg>
      <span class="nav-tip">Filme</span>
    </button>
    <button class="nav-item nav-cat" data-view="series" aria-label="Seriale">
      <svg viewBox="0 0 24 24"><path fill-rule="evenodd" d="M21 3H3a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5v2h8v-2h5a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm0 14H3V5h18z"/></svg>
      <span class="nav-tip">Seriale</span>
    </button>
    <button class="nav-item nav-cat" data-view="cartoons" aria-label="Desene animate">
      <svg viewBox="0 0 24 24"><path fill-rule="evenodd" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zM8.5 7.5a1.6 1.6 0 1 1 0 3.2 1.6 1.6 0 0 1 0-3.2zm7 0a1.6 1.6 0 1 1 0 3.2 1.6 1.6 0 0 1 0-3.2zM6.8 13.5h10.4a5.4 5.4 0 0 1-10.4 0z"/></svg>
      <span class="nav-tip">Desene</span>
    </button>
    <button class="nav-item nav-cat" data-view="anime" aria-label="Anime">
      <svg viewBox="0 0 24 24"><path d="M12 2l1.9 5.6L19.8 6l-3.6 4.6L21 14l-6 .4-1.4 5.8L12 15l-1.6 5.2L9 14.4 3 14l4.8-3.4L4.2 6l5.9 1.6z"/></svg>
      <span class="nav-tip">Anime</span>
    </button>
    <div class="nav-sep"></div>
    <button class="nav-item" data-view="watchlist" aria-label="Watchlist">
      <svg viewBox="0 0 24 24"><path d="M12 17.3l-6.2 3.7 1.6-7L2 9.2l7.1-.6L12 2l2.9 6.6 7.1.6-5.4 4.8 1.6 7z"/></svg>
      <span class="nav-tip">Watchlist</span>
    </button>
    <button class="nav-item" data-view="continue" aria-label="Continuă">
      <svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 0 0-9 9H1l3.9 3.9L8.8 12h-3a7 7 0 1 1 2 5l1.4 1.4A9 9 0 1 0 13 3zm-1 5v5l4.3 2.5.7-1.2-3.5-2V8z"/></svg>
      <span class="nav-tip">Continuă</span>
    </button>
    <button class="nav-item" data-view="downloads" aria-label="Descărcări">
      <svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5zM19 9h-4V3H9v6H5l7 7z"/></svg>
      <span class="nav-tip">Descărcări</span>
    </button>
  </div>
</nav>

<main id="content"></main>

<!-- Overlay căutare -->
<div id="search-overlay" class="search-overlay hidden">
  <div class="search-box">
    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.8l-.3-.3a6.5 6.5 0 1 0-.7.7l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg>
    <input id="search-input" type="search" placeholder="Caută filme și seriale... (Enter pentru tot)" autocomplete="off">
    <button id="search-close" class="search-close" aria-label="Închide căutarea">&times;</button>
  </div>
  <div id="search-results" class="search-results"></div>
</div>

<!-- Modal detaliu -->
<div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Detalii titlu">
  <div class="modal-panel">
    <button id="modal-close" class="modal-close" aria-label="Închide">&times;</button>
    <div id="modal-body"></div>
  </div>
  <div id="modal-fade" class="scroll-fade hidden"></div>
</div>

<!-- Login (publicat pe web cu parolă) -->
<div id="login-overlay" class="login-overlay hidden">
  <div class="login-panel">
    <div class="nav-logo" style="margin:0 auto 1rem">Cinema</div>
    <div class="login-title">Autentificare</div>
    <input id="login-pass" type="password" placeholder="Parola" autocomplete="current-password">
    <button class="btn" id="login-btn">Intră</button>
    <div id="login-err" class="login-err hidden"></div>
  </div>
</div>

<script src="/static/app.js?v=28"></script>
</body>
</html>
