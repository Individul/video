<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cinema</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="apple-touch-icon" href="/static/favicon.svg">
<script>
  /* tema aleasă (sau a sistemului, dacă n-ai ales) se aplică înainte de desenare: fără clipire */
  (function () {
    var t = null;
    try { t = localStorage.getItem("cinema-theme"); } catch (e) {}
    if (!t) t = window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
    document.documentElement.dataset.theme = t;
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="/static/style.css?v=51">
</head>
<body>

    <button class="nav-item" data-view="search" aria-label="Căutare">

      <span class="nav-tip">Căutare</span>

    <div class="nav-group nav-cat">Catalog</div>
    <button class="nav-item nav-cat" data-view="films" aria-label="Filme">

      <span class="nav-tip">Filme</span>

    <button class="nav-item nav-cat" data-view="series" aria-label="Seriale">

      <span class="nav-tip">Seriale</span>
    </button>
    <button class="nav-item nav-cat" data-view="cartoons" aria-label="Desene animate">

      <span class="nav-tip">Desene</span>
    </button>
    <button class="nav-item nav-cat" data-view="anime" aria-label="Anime">
      <svg viewBox="0 0 24 24"><path d="M12 2l1.9 5.6L19.8 6l-3.6 4.6L21 14l-6 .4-1.4 5.8L12 15l-1.6 5.2L9 14.4 3 14l4.8-3.4L4.2 6l5.9 1.6z"/></svg>
      <span class="nav-tip">Anime</span>
    </button>
    <div class="nav-group nav-cat">Sport</div>
    <button class="nav-item nav-cat" data-view="sport" aria-label="Sport">
      <svg viewBox="0 0 24 24"><path fill-rule="evenodd" d="M19 5h-2V3H7v2H5a2 2 0 0 0-2 2v1a5 5 0 0 0 4.4 5A5 5 0 0 0 11 15.9V19H7v2h10v-2h-4v-3.1a5 5 0 0 0 3.6-2.9A5 5 0 0 0 21 8V7a2 2 0 0 0-2-2zM5 8V7h2v3.8A3 3 0 0 1 5 8zm14 0a3 3 0 0 1-2 2.8V7h2z"/></svg>
      <span class="nav-tip">Sport</span>
    </button>
    <button class="nav-item nav-cat" data-view="live" aria-label="Live">

      <span class="nav-tip">Live</span>
    </button>
    <div class="nav-group">Al meu</div>
    <button class="nav-item" data-view="watchlist" aria-label="Watchlist">

    <button class="nav-item nav-cat" data-view="torrents" aria-label="Căutare torrente">
      <svg viewBox="0 0 24 24"><path d="M3 7v6a9 9 0 0 0 18 0V7h-4v6a5 5 0 0 1-10 0V7zm0-4h4v3H3zm14 0h4v3h-4z"/></svg>

    <span class="nav-tip">Strânge</span>

<main id="content"></main>

<!-- Overlay căutare -->
<div id="search-overlay" class="search-overlay hidden">
  <div class="search-box">
    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.8l-.3-.3a6.5 6.5 0 1 0-.7.7l.3.3v.8l5 5 1.5-1.5-5-5zm-6 0a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/></svg>
    <input id="search-input" type="search" placeholder="Caută filme și seriale... (Enter pentru tot)" autocomplete="off">
    <button id="search-close" class="search-close" aria-label="Închide căutarea">&times;</button>
  </div>
  <div id="search-empty" class="search-empty hidden"></div>
  <div id="search-results" class="search-results"></div>
</div>

<!-- Modal detaliu -->
<div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-label="Detalii titlu">
  <div class="modal-panel">
    <button id="modal-close" class="modal-close" aria-label="Închide">&times;</button>
    <div id="modal-body"></div>
  </div>
  <div id="modal-fade" class="scroll-fade hidden"></div>
</div>

<!-- Modul cinema: player pe toată fereastra + panou lateral (versiuni / episoade / stare) -->
<div id="cinema" class="cinema hidden" role="dialog" aria-modal="true" aria-label="Player">
  <div class="cin-top">
    <button class="cin-back" id="cin-close" aria-label="Închide player-ul">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M20 11H7.8l5.6-5.6L12 4l-8 8 8 8 1.4-1.4L7.8 13H20z"/></svg>
    </button>
    <div class="cin-titles">
      <div class="cin-title" id="cin-title"></div>
      <div class="cin-sub" id="cin-sub"></div>
    </div>
    <div class="cin-mini" id="cin-mini" title="Starea torrentului"></div>
    <div class="cin-tabs">
      <button class="cin-tab" data-pane="versions">Versiuni</button>
      <button class="cin-tab hidden" data-pane="eps" id="cin-tab-eps">Episoade</button>
      <button class="cin-tab" data-pane="stats">Stare</button>
    </div>
  </div>
  <div class="cin-body">
    <div class="cin-stage" id="cin-stage"></div>
    <aside class="cin-panel hidden" id="cin-panel">
      <div class="cin-pane" id="cin-pane-versions"><div id="cin-files"></div></div>
      <div class="cin-pane hidden" id="cin-pane-eps"></div>
      <div class="cin-pane hidden" id="cin-pane-stats"><div class="status">Aștept stream-ul…</div></div>
    </aside>
  </div>
</div>

<!-- Login (publicat pe web cu parolă) -->
<div id="login-overlay" class="login-overlay hidden">
  <div class="login-panel">
    <div class="nav-logo" style="margin:0 auto 1rem">Cinema</div>
    <div class="login-title">Autentificare</div>
    <input id="login-pass" type="password" placeholder="Parola" autocomplete="current-password">
    <button class="btn" id="login-btn">Intră</button>
    <div id="login-err" class="login-err hidden"></div>
  </div>
</div>

<script src="/static/js/10-audio.js?v=50"></script>

</body>
