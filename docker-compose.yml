# Cinema pe VPS: portal + TorrServer + Jackett + FlareSolverr + Ace Stream, toate în rețeaua
# internă docker. Spre internet sunt expuse DOAR Caddy (80/443, HTTPS automat) și porturile de
# peers: 6881 (TorrServer) și 8621 (Ace Stream).
#
# Browserul nu vorbește direct cu TorrServer: primește /ts/stream/..., iar Caddy verifică
# întâi cookie-ul portalului (forward_auth) și abia apoi trimite cererea la TorrServer.
#
# Imaginile sunt fixate pe versiune + digest: un `docker compose pull` nu aduce nimic nou pe
# ascuns. Actualizare voită: schimbi tag-ul/digest-ul aici (vezi README-WEB), apoi
# `docker compose pull SERVICIU && docker compose up -d SERVICIU`; revenire = commit-ul anterior.
#
# Pornire: docker compose up -d --build      Date persistente: ./data ./torrserver ./jackett ./acestream

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"   # loguri plafonate: discul de 10 GB nu se umple în timp
    max-file: "3"

services:
  caddy:
    image: caddy:2.11.7-alpine@sha256:d8542f48d34a9cf4e4c11a478865229840e87e4c96ea3f439101f31a5d35f75f
    container_name: caddy
    ports:
      - "80:80"
      - "443:443"            # fără 443/udp: HTTP/3 e oprit (vezi Caddyfile)
    environment:
      - DOMAIN=${DOMAIN:?seteaza DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # certificatele HTTPS
      - caddy_config:/config
    depends_on: [vid, torrserver]
    mem_limit: 128m
    logging: *logging
    restart: unless-stopped

  vid:
    build: .
    container_name: vid
    environment:
      - TMDB_API_KEY=${TMDB_API_KEY}
      - TMDB_LANG=${TMDB_LANG:-ru-RU}
      - APP_PASSWORD=${APP_PASSWORD:?seteaza APP_PASSWORD in .env}
      - APP_SECRET=${APP_SECRET:?seteaza APP_SECRET in .env}
      - HTTPS_ON=1
      - PROXY=${PROXY:-}
      - TORRSERVER_URL=http://torrserver:8090
      - STREAM_PROXY_PATH=/ts
      - TORZNAB_URL=http://jackett:9117
      - TORZNAB_API_KEY=${TORZNAB_API_KEY:-}
      - OS_API_KEY=${OS_API_KEY:-}
      - KP_API_KEY=${KP_API_KEY:-}
    volumes:
      - ./data:/data
    mem_limit: 384m          # ffmpeg (extragerea subtitrărilor) rulează tot aici
    logging: *logging
    restart: unless-stopped
    # fără ports: îl vede doar Caddy

  torrserver:
    image: ghcr.io/yourok/torrserver:MatriX.147@sha256:12a728d64b956b6c19f1ef4691bc4ce51372afcc758c56e73724a7a5957e2a26
    container_name: torrserver
    environment:
      - TS_PORT=8090
      - TS_CONF_PATH=/opt/ts/config
      - TS_DONTKILL=1
    volumes:
      - ./torrserver:/opt/ts/config   # settings.json + config.db (cache doar în RAM, UseDisk=false)
    ports:
      - "6881:6881"          # peers BitTorrent (PeersListenPort din settings.json)
      - "6881:6881/udp"
    mem_limit: 1536m         # 1 GB cache + overhead (VPS cu 4 GB RAM)
    logging: *logging
    restart: unless-stopped
    # 8090 NU e publicat: interfața și stream-urile se ating doar prin Caddy, după login

  jackett:
    image: lscr.io/linuxserver/jackett:v0.24.2867-ls8@sha256:94ee04d06870b7204533dd93da093004f70b1b33eb1cab2822b3f921fd7c4a44
    container_name: jackett
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ:-Europe/Chisinau}
      - AUTO_UPDATE=false    # imaginea se actualizează cu docker compose pull
    volumes:
      - ./jackett:/config
    ports:
      - "127.0.0.1:9117:9117"   # interfața web doar prin tunel SSH (vezi README-WEB)
    mem_limit: 384m
    logging: *logging
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2@sha256:c80ae007ce2ccdcd217a12426e4f039ef763ff90738c808d38810c3e59323767
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=warning   # la "info" scrie în log parolele de login trimise de Jackett
      - TZ=${TZ:-Europe/Chisinau}
    mem_limit: 768m          # Chromium pornește doar la nevoie; dacă depășește, cade doar el
    logging: *logging
    restart: unless-stopped

  acestream:
    # motorul Ace Stream (transmisii live P2P), construit din pachetul OFICIAL acestream.org
    build: ./deploy/acestream
    container_name: acestream
    volumes:
      - ./acestream:/data        # stare + cache (cache-ul live stă pe disc, nu în RAM)
    mem_limit: 1g                # ~140 MB în repaus, ~45 MB per spectator live; 450 MB ajungea doar la 2–3 spectatori
    logging: *logging
    restart: unless-stopped
    ports:
      # doar portul P2P (ca 6881 la TorrServer): fără el ceilalți peers nu se pot conecta la noi
      - "8621:8621/tcp"
      - "8621:8621/udp"
    # API-ul 6878 rămâne intern: îl văd doar Caddy (după login) și portalul

volumes:
  caddy_data:
  caddy_config:
